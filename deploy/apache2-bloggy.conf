# ====================================================================
# Apache2 VirtualHost Configuration for Bloggy
# Production Single-Page React App with Express Reverse Proxy
# Path on server: /etc/apache2/sites-available/bloggy.conf
# ====================================================================

# 1. HTTP Configuration (Port 80)
<VirtualHost *:80>
    ServerName bloggy.yourdomain.com
    ServerAlias www.bloggy.yourdomain.com
    ServerAdmin webmaster@yourdomain.com

    # Document root pointing to Vite production build
    DocumentRoot /var/www/bloggy/frontend/dist

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/bloggy_error.log
    CustomLog ${APACHE_LOG_DIR}/bloggy_access.log combined

    # ----------------------------------------------------------------
    # 2. Hardened Security Headers (mod_headers)
    # ----------------------------------------------------------------
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"

    # ----------------------------------------------------------------
    # 3. Static Frontend Serving & HTML5 PushState Fallback
    # ----------------------------------------------------------------
    <Directory /var/www/bloggy/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # HTML5 history API fallback (React Router routing)
        FallbackResource /index.html
    </Directory>

    # Cache static build assets aggressively
    <LocationMatch "^/assets/">
        Header set Cache-Control "max-age=31536000, public, immutable"
    </LocationMatch>

    # ----------------------------------------------------------------
    # 4. Reverse Proxy Directives for Node.js API & Uploads
    # Requires: a2enmod proxy proxy_http headers rewrite
    # ----------------------------------------------------------------
    ProxyRequests Off
    ProxyPreserveHost On

    # Proxy /api requests to local Express server on port 5000
    ProxyPass /api http://127.0.0.1:5000/api retry=0 timeout=60
    ProxyPassReverse /api http://127.0.0.1:5000/api

    # Proxy uploaded media or serve via Alias
    ProxyPass /uploads http://127.0.0.1:5000/uploads retry=0 timeout=60
    ProxyPassReverse /uploads http://127.0.0.1:5000/uploads

    # ----------------------------------------------------------------
    # 5. Gzip Compression (mod_deflate)
    # ----------------------------------------------------------------
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json
    </IfModule>
</VirtualHost>

